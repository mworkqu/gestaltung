name: CAD Champions

# Lint, types, strings, unit tests, a production build with the test-only
# fixture routes switched on, the CAD Champions Playwright suite, and the
# grader's pytest. No secrets: the build gets DUMMY Supabase values (nothing
# listens on them), so every server read fails fast and the pages show their
# "being set up" states; the e2e write guard still aborts any write. Same idea
# as the local smoke suite (CLAUDE.md PHASE 3.8), which also never writes.

on:
  push:
    branches: [main, cad-champions]
  pull_request:
    branches: [main, cad-champions]

concurrency:
  group: cad-champions-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  web:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: "true"
      NEXT_TELEMETRY_DISABLED: "1"
      # Dummy values: unreachable on purpose (never a real project, never a secret).
      NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
      NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
      # Turns on /cad-champions/{en,ar}/e2e-fixtures/* (lib/e2e-fixtures.ts; never on Vercel).
      E2E_FIXTURES: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run i18n:check
      - run: npx vitest run

      - name: Build (fixtures on)
        run: npm run build

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Playwright (CAD Champions)
        run: npx playwright test e2e/cad-champions

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  grader:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: grader
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            grader/requirements.txt
            grader/requirements-dev.txt

      # The CadQuery wheel (cadquery-ocp / vtk) is large and may not install on
      # every runner; tests marked cadquery skip themselves without it.
      - name: Install runtime requirements (CadQuery may fail)
        continue-on-error: true
        run: pip install -r requirements.txt

      - name: Install the rest without CadQuery
        run: |
          grep -vE '^(cadquery|cadquery-ocp|vtk|nlopt|multimethod)==' requirements.txt > /tmp/requirements-lite.txt
          pip install -r /tmp/requirements-lite.txt -r requirements-dev.txt

      - run: python -m pytest
